<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | ZamFarm Climate</title>
  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    :root{--g:#198A00;--gl:#23b800;--gd:#0f5c00;--r:#EF0000;--o:#EF7D00;--gold:#F5C518;--blk:#141414;--bg:#F4F9F0;--surface:#fff;--surface2:#f0f5ec;--border:rgba(25,138,0,.14);--text:#141414;--text2:#555;--text3:#999;}
    [data-theme="dark"]{--bg:#0d1a0a;--surface:#132010;--surface2:#1a2e14;--border:rgba(35,184,0,.15);--text:#e8f5e3;--text2:#9ab890;--text3:#5a7a55;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
    .card{background:var(--surface);border-radius:20px;width:min(440px,100%);box-shadow:0 16px 48px rgba(0,0,0,.14);overflow:hidden;}
    .card-hero{background:linear-gradient(160deg,var(--gd),#0a2200,var(--blk));padding:36px 32px 28px;text-align:center;position:relative;}
    .card-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--g),var(--gold),var(--o));}
    .hero-icon{font-size:3rem;display:block;margin-bottom:12px;animation:pulse 2s infinite;}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
    .hero-title{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:700;color:#fff;margin-bottom:6px;}
    .hero-sub{font-size:.85rem;color:rgba(255,255,255,.5);font-weight:600;}
    .card-body{padding:32px;}
    .form-group{margin-bottom:18px;}
    .zm-label{display:block;font-size:.7rem;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--gd);margin-bottom:6px;}
    [data-theme="dark"] .zm-label{color:var(--gl);}
    .iw{position:relative;}
    .iw i.ico{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#bbb;font-size:.9rem;pointer-events:none;}
    .iw:focus-within i.ico{color:var(--g);}
    .zm-input{width:100%;padding:12px 12px 12px 40px;border:2px solid var(--border);border-radius:11px;font-family:'Outfit',sans-serif;font-size:.92rem;font-weight:600;color:var(--text);background:var(--surface2);outline:none;transition:border-color .2s,box-shadow .2s;}
    .zm-input:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(25,138,0,.12);}
    .hint{font-size:.72rem;color:var(--text3);font-weight:600;margin-top:5px;}
    .btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border:none;border-radius:12px;font-family:'Outfit',sans-serif;font-size:1rem;font-weight:800;cursor:pointer;transition:all .2s;box-shadow:0 6px 20px rgba(25,138,0,.35);display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(25,138,0,.5);}
    .back-link{text-align:center;margin-top:16px;font-size:.85rem;color:var(--text3);}
    .back-link a{color:var(--g);font-weight:700;text-decoration:none;}
    .back-link a:hover{color:var(--gl);}
    .flash{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:.85rem;font-weight:700;display:flex;align-items:flex-start;gap:10px;}
    .flash-info{background:rgba(46,134,171,.1);color:var(--sky);border:1px solid rgba(46,134,171,.2);}
    .flash-error{background:rgba(239,0,0,.08);color:var(--r);border:1px solid rgba(239,0,0,.15);}
    .flash-success{background:rgba(25,138,0,.1);color:var(--gd);border:1px solid rgba(25,138,0,.2);}
    .steps{display:flex;gap:6px;justify-content:center;margin-bottom:24px;}
    .step-dot{width:32px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);}
    .step-dot.active{background:var(--gold);}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-hero">
      <span class="hero-icon">🔐</span>
      <div class="hero-title">Forgot Password?</div>
      <div class="hero-sub">Enter your email or phone — we'll send you an OTP</div>
      <div class="steps" style="margin-top:16px;margin-bottom:0;">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>
    </div>
    <div class="card-body">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
        <div class="flash flash-{{ cat }}">
          <i class="fa-solid fa-{{ 'circle-info' if cat=='info' else 'circle-check' if cat=='success' else 'triangle-exclamation' }}"></i>
          <span>{{ msg }}</span>
        </div>
        {% endfor %}
      {% endwith %}

      <form method="POST" id="forgotForm">
        <div class="form-group">
          <label class="zm-label">Email Address or Phone Number</label>
          <div class="iw">
            <i class="fa-solid fa-user ico"></i>
            <input type="text" name="identifier" id="identifierInput" class="zm-input"
                   placeholder="e.g. john@email.com or +260971..."
                   autofocus required>
          </div>
          <div class="hint">Use the email or phone number you registered with.</div>
        </div>
        <button type="submit" class="btn-primary">
          <i class="fa-solid fa-paper-plane"></i> Send OTP Code
        </button>
      </form>
      <div class="back-link">
        <a href="/login"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
      </div>
    </div>
  </div>

  <script>
    // When the user submits a request for a new OTP, 
    // clear any old timers saved in the browser so the next screen starts fresh.
    document.getElementById('forgotForm').addEventListener('submit', function() {
        const identifier = document.getElementById('identifierInput').value.trim();
        const timerKey = 'otp_expiry_time_' + identifier;
        sessionStorage.removeItem(timerKey);
    });
  </script>
</body>
</html>
