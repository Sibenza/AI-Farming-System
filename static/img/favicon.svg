<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#198A00"/>
  <!-- Zambia flag stripe accent at bottom -->
  <rect x="0" y="52" width="64" height="4" fill="#EF0000" rx="0"/>
  <rect x="0" y="56" width="64" height="4" fill="#141414" rx="0"/>
  <rect x="0" y="60" width="64" height="4" fill="#EF7D00" rx="0"/>
  <!-- Wheat/leaf icon -->
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Stem -->
    <line x1="32" y1="50" x2="32" y2="18"/>
    <!-- Left grain spikes -->
    <line x1="32" y1="24" x2="24" y2="18"/>
    <line x1="32" y1="30" x2="22" y2="25"/>
    <line x1="32" y1="36" x2="24" y2="32"/>
    <!-- Right grain spikes -->
    <line x1="32" y1="24" x2="40" y2="18"/>
    <line x1="32" y1="30" x2="42" y2="25"/>
    <line x1="32" y1="36" x2="40" y2="32"/>
    <!-- Top grain head -->
    <ellipse cx="32" cy="16" rx="3" ry="5" fill="#F5C518" stroke="#F5C518"/>
  </g>
  <!-- "ZF" text -->
  <text x="32" y="56" font-family="Arial,sans-serif" font-size="0" fill="white" text-anchor="middle"/>
</svg>